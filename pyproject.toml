[project]
name = "workspace"
version = "0.1.0"
description = "Workspace project"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.15",
    "anthropic>=0.69.0",
    "beautifulsoup4>=4.14.2",
    "claude-code-sdk>=0.0.20",
    "click>=8.2.1",
    "httpx>=0.28.1",
    "langchain>=0.2.1",
    "langchain-openai>=0.3.28",
    "markdownify>=1.2.0",
    "networkx>=3.5",
    "openai>=1.108.1",
    "pdf2image>=1.17.0",
    "pillow>=12.0.0",
    "playwright>=1.57.0",
    "pydantic>=2.11.7",
    "pydantic-ai>=1.0.10",
    "pydantic-settings>=2.10.1",
    "pydot>=4.0.1",
    "python-dotenv>=1.1.1",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.13.0",
    "requests>=2.32.4",
    "rich>=14.1.0",
    "tavily-python>=0.7.14",
    "tiktoken>=0.11.0",
    "tqdm>=4.67.1",
    "yt-dlp>=2025.9.26",
]

[project.scripts]
flow-builder = "amplifier.flow_builder.cli:cli"
dotrunner = "ai_working.dotrunner.cli:cli"
blog-scraper = "amplifier.blog_scraper.cli:cli"

[tool.setuptools]
packages = ["amplifier", "ai_working"]

[tool.uv]
package = true

[tool.uv.workspace]
# Add all projects in the workspace
members = []

[tool.uv.sources]
# Example: my-project = { workspace = true }

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "debugpy>=1.8.14",
    "pyright>=1.1.407",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.10",
    "twine>=6.1.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "**/.venv/**",
    "**/node_modules/**",
    ".git/**",
    ".ruff_cache/**",
    ".pytest_cache/**",
    "*.egg-info",
    "build/**",
    "dist/**",
    ".data/**",
    ".beads/**",            # Evidence files (copies of implementation)
    "ai_working/**",
    "amplifier/bplan/**",  # Temporary: Remove after fixing type errors (27 errors)
    "tests/bplan/**",       # Temporary: Remove after fixing type errors
    "tests/test_beads_evidence.py",  # Temporary: Remove after fixing type error
    "tests/test_todowrite_evidence.py",  # Contains "TODO" in test data strings
    "tests/test_evidence_blocking.py",   # Contains "Todo" in test data strings
]
typeCheckingMode = "basic"
reportMissingImports = false
pythonVersion = "3.11"
